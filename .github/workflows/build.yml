name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Download Gradle distribution
        run: |
          GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\([0-9.]*\)-bin.zip.*/\1/')
          mkdir -p "$HOME/gradle-dist"
          curl -L "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$HOME/gradle-dist/gradle.zip"
          unzip -q "$HOME/gradle-dist/gradle.zip" -d "$HOME/gradle-dist"
          chmod +x "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle"

      - name: Build Debug APK
        run: |
          GRADLE_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed 's/.*gradle-\([0-9.]*\)-bin.zip.*/\1/')
          "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickShareLite-debug
          path: app/build/outputs/apk/debug/*.apk
